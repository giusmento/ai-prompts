[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-prompts-mcp"
version = "1.0.0"
description = "A Model Context Protocol server for curated AI prompts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giuseppe Mento", email = "giuseppe@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.5.0",
    "mcp[cli]>=1.13.1",
]

[project.scripts]
ai-prompts = "src.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "build-prd/",
    "src/",
    "documentation/",
]

[project.urls]
Homepage = "https://github.com/giuseppemento/ai-prompts"
Repository = "https://github.com/giuseppemento/ai-prompts"
Issues = "https://github.com/giuseppemento/ai-prompts/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

