[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-prompts-mcp"
version = "1.0.0"
description = "A Model Context Protocol server for curated AI prompts"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giuseppe Mento", email = "giuseppe@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.5.0",
    "mcp[cli]>=1.13.1",
]

[project.scripts]
ai-prompts-server = "local:main"

[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "build-prd/",
    "documentation/",
]

[project.urls]
Homepage = "https://github.com/giuseppemento/ai-prompts"
Repository = "https://github.com/giuseppemento/ai-prompts"
Issues = "https://github.com/giuseppemento/ai-prompts/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
